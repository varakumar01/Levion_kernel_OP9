name: Nethunter

on:
  push:
    branches:
      - nethunter  # Trigger only on nethunter branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout device tree repository
        uses: actions/checkout@v4

      - name: Debug repository structure
        run: |
          echo "Current working directory: $(pwd)"
          echo "Device tree repository structure:"
          ls

      - name: Make compile.sh executable and run
        run: |
          chmod +x ./compile.sh
          ./compile.sh

      - name: Find generated zip
        id: zip
        run: |
          FILE=$(ls $HOME/op9/*.zip | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No zip found in $HOME/op9!"
            exit 1
          fi
          echo "zip_file=$FILE" >> $GITHUB_ENV
          FILE_NAME=$(basename "$FILE")
          echo "zip_name=$FILE_NAME" >> $GITHUB_ENV
          echo "Found zip: $FILE_NAME"

      - name: Create GitHub Release
        id: release
        uses: actions/create-release@v1
        with:
          tag_name: Nethunter
          release_name: Nethunter
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload zip to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ${{ env.zip_file }}
          asset_name: ${{ env.zip_name }}
          asset_content_type: application/zip