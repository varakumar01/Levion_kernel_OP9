name: Nethunter

on:
  workflow_dispatch:    # Start only manually

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Checkout kernel source ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # ── 2. Free up disk space (runners only have ~14 GB free) ─────────────
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      # ── 3. Cache Clang toolchain (clang-r547379) ───────────────────────────
      - name: Cache Clang toolchain
        uses: actions/cache@v4
        with:
          path: toolchains/linux-x86/clang-r547379
          key: clang-r547379-${{ runner.os }}-v1

      # ── 4. Cache ccache objects ────────────────────────────────────────────
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      # ── 5. Make compile.sh executable ─────────────────────────────────────
      - name: Make compile.sh executable
        run: chmod +x compile.sh

      # ── 6. Run compile.sh ─────────────────────────────────────────────────
      - name: Run compile.sh
        run: ./compile.sh --device=lahaina
        env:
          DEBIAN_FRONTEND: noninteractive

      # ── 7. Show ccache stats ───────────────────────────────────────────────
      - name: ccache stats
        if: always()
        run: ccache --show-stats 2>/dev/null || true

      # ── 8. Upload raw kernel images as artifacts ───────────────────────────
      - name: Upload kernel images
        uses: actions/upload-artifact@v4
        with:
          name: Neutrino-images
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 30
