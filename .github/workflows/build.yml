name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: nethunterv2

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev libelf-dev git zip

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$HOME/clang"

      - name: Compile Kernel
        run: |
          export PATH="$HOME/clang/clang-r383902/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          
          mkdir out
          make O=out vendor/lahaina-gki_defconfig
          make -j$(nproc) O=out

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image AnyKernel/ || cp out/arch/arm64/boot/Image.gz AnyKernel/
          cd AnyKernel
          zip -r9 ../Levion-NetHunter-MT7610U.zip * -x .git\* README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Levion-NetHunter-Kernel
          path: Levion-NetHunter-MT7610U.zip
          
